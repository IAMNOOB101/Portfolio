spring.application.name=backend

# Use Railway's/Render's injected PORT, fall back to 8080 locally
server.port=${PORT:8080}

# H2 In-Memory DB
spring.datasource.url=jdbc:h2:mem:portfolio
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: Hibernate creates the schema fresh on startup
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# CRITICAL: defer data.sql until AFTER Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 console disabled in production
spring.h2.console.enabled=false
