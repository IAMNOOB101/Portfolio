version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: portfolio-backend
    ports:
      - "8080:8080"
    networks:
      - portfolio-network

  frontend:
    build:
      context: ./frontend
    container_name: portfolio-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
